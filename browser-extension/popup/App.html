<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veridex</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Extension Header -->
    <header class="app-header">
      <div class="brand-title">
        <svg class="brand-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span>VERIDEX</span>
      </div>
      <div id="serverStatus" class="status-badge" title="Server Connection Status">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <!-- Main Verification Section -->
    <div class="action-section">
      <button id="verifyBtn" class="primary-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Verify Current Page
      </button>

      <!-- Quick Text / Selection Check Box -->
      <div class="custom-input-box">
        <textarea id="customInput" rows="2" placeholder="Paste phrase, link, or email text to verify…"></textarea>
        <button id="checkCustomBtn" class="accent-btn">Check Text</button>
      </div>
    </div>

    <!-- Structured Result Card -->
    <div id="resultCard" class="result-card">
      <div id="resultBanner" class="result-banner safe">
        <div class="banner-left">
          <span id="resultIcon"></span>
          <span id="resultVerdict" class="result-verdict">SAFE</span>
        </div>
        <span id="resultConfidence" class="result-confidence">90%</span>
      </div>
      
      <div id="resultSnippet" class="result-snippet"></div>
      <div id="resultExplanation" class="result-explanation"></div>
      <div id="resultSignals" class="result-signals"></div>
    </div>

    <!-- Controls Row -->
    <div class="controls-row">
      <button id="toggleBtn" class="outline-btn">Toggle In-Page UI</button>
      <button id="historyBtn" class="outline-btn">History (<span id="historyCount">0</span>)</button>
    </div>

    <!-- Recent History Drawer -->
    <div id="historySection" class="history-section">
      <div class="history-header">
        <span>EXAMINATION LOG</span>
        <button id="clearHistory" class="link-btn">Clear</button>
      </div>
      <div id="historyList"></div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <button id="optionsBtn" class="link-btn">Settings</button>
      <a href="http://localhost:3000" target="_blank" class="app-link">Open Web App ↗</a>
      <span id="version" class="version-tag">v1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
